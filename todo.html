<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do App</title>

    <link rel="stylesheet" href="css/todo.css?v=2">
</head>

<body>

    <main>

        <h1>My To-Do List</h1>

        <form id="todo-form">

            <input
                type="text"
                id="todo-input"
                placeholder="Enter a task"
                required
            >

            <button type="submit">
                Add
            </button>

        </form>


        <div id="filter-buttons">

            <button
                type="button"
                data-filter="all"
                class="active-filter"
            >
                All
            </button>

            <button
                type="button"
                data-filter="open"
            >
                Open
            </button>

            <button
                type="button"
                data-filter="done"
            >
                Done
            </button>

        </div>


        <p id="empty-message">
            No tasks yet.
        </p>

        <ul id="todo-list"></ul>

    </main>

    <script src="js/todo.js"></script>

</body>

</html>
