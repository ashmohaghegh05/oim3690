<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f7fa;
            color: #1f2937;
            margin: 0;
            padding: 40px 20px;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
        }

        h1 {
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            font: inherit;
            border: 1px solid #cccccc;
        }

        textarea {
            min-height: 140px;
        }

        button {
            background-color: #111827;
            color: white;
            border: none;
            padding: 12px 18px;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background-color: #374151;
        }
    </style>
</head>

<body>

    <main>

        <h1>Contact Form</h1>

        <form>

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                required
            ></textarea>

            <button type="submit">
                Submit
            </button>

        </form>

    </main>

</body>

</html>
