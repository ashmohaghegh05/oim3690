<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buzzword Meter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 18px;
      color: #25324a;
      background: #f7f5ef;
      font: 14px/1.5 Arial, Helvetica, sans-serif;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
    }

    p {
      margin: 0 0 14px;
    }

    .setting {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 14px 0;
      font-weight: 700;
    }

    label[for="word-input"] {
      display: block;
      margin-bottom: 5px;
      font-weight: 700;
    }

    input[type="text"] {
      width: 100%;
      padding: 9px;
      border: 1px solid #8b91a0;
      border-radius: 5px;
      font: inherit;
    }

    button {
      padding: 9px 12px;
      border: 0;
      border-radius: 5px;
      color: #ffffff;
      background: #25324a;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #394b6d;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #d39b00;
      outline-offset: 2px;
    }

    #add-word {
      width: 100%;
      margin-top: 8px;
    }

    #custom-word-list {
      padding-left: 20px;
      overflow-wrap: anywhere;
    }

    .remove-word {
      margin-left: 8px;
      padding: 3px 7px;
      color: #25324a;
      background: #e6e8ed;
      font-size: 12px;
    }

    #status {
      min-height: 21px;
      margin-top: 12px;
      font-weight: 700;
    }

    .help {
      margin-top: 12px;
      color: #4b5260;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <h1>Buzzword Meter</h1>
  <p>Check the language used in a Lever job posting.</p>

  <label class="setting">
    <input id="enabled" type="checkbox">
    Turn the meter on
  </label>

  <label for="word-input">Add a word or phrase</label>
  <input
    id="word-input"
    type="text"
    autocomplete="off"
    placeholder="Example: curious"
  >

  <button id="add-word" type="button">Add word</button>

  <h2>Your added words</h2>
  <ul id="custom-word-list"></ul>

  <p id="status" role="status" aria-live="polite"></p>

  <p class="help">
    After changing a setting, refresh the Lever job page to update its banner.
  </p>

  <script src="popup.js"></script>
</body>
</html>
